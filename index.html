<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📍 တည်နေရာမျှဝေခြင်း</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#050816;
  color:#fff;
  min-height:100vh;
  padding:20px 16px;
  font-family:sans-serif;
}
.container{max-width:520px;margin:0 auto}
h1{font-size:22px;text-align:center;margin-bottom:20px;color:#FFD700}

.btn-main{
  width:100%;
  padding:20px;
  border:none;
  border-radius:16px;
  font-size:18px;
  font-weight:bold;
  background:linear-gradient(135deg,#00FFC8,#00CC99);
  color:#000;
  cursor:pointer;
  margin-bottom:20px;
}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.5}

.box{
  background:#0F1429;
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  display:none;
}
.box-title{font-weight:bold;margin-bottom:12px;color:#00FFC8}

.link-text{
  background:#000;
  border:1px solid #FFD700;
  border-radius:10px;
  padding:14px;
  color:#fff;
  font-size:14px;
  word-break:break-all;
  margin-bottom:12px;
}
.hint{font-size:13px;color:#FFD700;line-height:1.6}

#map{
  width:100%;
  height:350px;
  border-radius:12px;
  margin-top:16px;
  display:none;
}
.info{margin-top:12px;line-height:1.8}
.hide{display:none!important}
</style>
</head>
<body>
<div class="container">
  <h1>📍 တည်နေရာမျှဝေခြင်း</h1>

  <button id="shareBtn" class="btn-main" onclick="getLocation()">⚡ ကျွန်ုပ်နေရာ မျှဝေမည်</button>

  <!-- လမ်းညွှန်အကွက် -->
  <div id="guideBox" class="box">
    <div class="box-title">တည်နေရာရယူရန်</div>
    <p>၁️⃣ ဖုန်းရဲ့ GPS ကို ဖွင့်ပါ</p>
    <p>၂️⃣ ပေါ်လာတဲ့မေးခွန်းထဲက <b>"ခွင့်ပြုပါ"</b> ကို နှိပ်ပါ</p>
    <p id="errMsg" style="color:#FF6B6B;margin-top:10px"></p>
  </div>

  <!-- လင့်အကွက် -->
  <div id="linkBox" class="box">
    <div class="box-title">👇 သင့်လင့်</div>
    <div id="linkDisplay" class="link-text"></div>
    <p class="hint">💡 အပေါ်ကလင့်ကို ဖိထားပါ → ကူးယူပါ → မိတ်ဆွေထံပေးပို့ပါ</p>
  </div>

  <!-- မြေပုံ + အချက်အလက် -->
  <div id="map"></div>
  <div id="myInfo" class="info hide"></div>
  <div id="urInfo" class="info hide"></div>
  <div id="distInfo" class="info hide"></div>
</div>

<script>
let map, mapReady=false;
let myLat, myLon;

window.onload=function(){
  const p=new URLSearchParams(location.search);
  const la=p.get('lat');
  const lo=p.get('lon');
  if(la && lo){
    showOther(parseFloat(la), parseFloat(lo));
  }
};

function getLocation(){
  const btn=document.getElementById('shareBtn');
  const guide=document.getElementById('guideBox');
  const err=document.getElementById('errMsg');
  
  btn.disabled=true;
  btn.innerText='စောင့်ပါ...';
  guide.style.display='block';
  err.innerText='';

  if(!navigator.geolocation){
    err.innerText='❌ GPS မတွေ့ပါ။ Chrome/Safari ဖြင့် ကြိုးစားပါ။';
    btn.disabled=false;
    btn.innerText='⚡ ထပ်မံကြိုးစားမည်';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(pos){
      myLat=pos.coords.latitude;
      myLon=pos.coords.longitude;
      
      guide.style.display='none';
      showLink();
      showMyOnMap();
      
      btn.disabled=false;
      btn.innerText='⚡ ကျွန်ုပ်နေရာ မျှဝေမည်';
    },
    function(e){
      let msg='';
      if(e.code===1) msg='❌ ခွင့်မပြုမိပါ။ လိပ်စာဘားရှိ 🔒 → တည်နေရာ → ခွင့်ပြု';
      else if(e.code===2) msg='❌ GPS အချက်ပြမရပါ။ ဖုန်းဆက်တင်များမှ GPS ဖွင့်ပါ';
      else msg='❌ မအောင်မြင်ပါ။ ပွင့်လင်းနေရာတွင် ထပ်ကြိုးစားပါ';
      err.innerText=msg;
      btn.disabled=false;
      btn.innerText='⚡ ထပ်မံကြိုးစားမည်';
    },
    {enableHighAccuracy:true, timeout:15000}
  );
}

function showLink(){
  const base=location.href.split('?')[0];
  const link=base+'?lat='+myLat+'&lon='+myLon;
  document.getElementById('linkDisplay').innerText=link;
  document.getElementById('linkBox').style.display='block';
}

function showMyOnMap(){
  initMap(myLat, myLon);
  L.marker([myLat, myLon]).addTo(map).bindPopup('ကျွန်ုပ်');
  document.getElementById('myInfo').innerHTML='🟢 ကျွန်ုပ်နေရာ: '+myLat.toFixed(5)+', '+myLon.toFixed(5);
  document.getElementById('myInfo').classList.remove('hide');
}

function showOther(la, lo){
  initMap(la, lo);
  L.marker([la, lo]).addTo(map).bindPopup('သူ့နေရာ');
  document.getElementById('urInfo').innerHTML='🔵 သူ့နေရာ: '+la.toFixed(5)+', '+lo.toFixed(5);
  document.getElementById('urInfo').classList.remove('hide');
  
  if(myLat){
    L.polyline([[myLat,myLon],[la,lo]], {color:'#FF6B35', weight:4}).addTo(map);
    map.fitBounds([[myLat,myLon],[la,lo]], {padding:[30,30]});
    showDistance(myLat,myLon,la,lo);
  }
}

function initMap(la, lo){
  document.getElementById('map').style.display='block';
  if(!mapReady){
    map=L.map('map').setView([la, lo], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    mapReady=true;
  }
}

function showDistance(l1,o1,l2,o2){
  const R=6371000;
  const p=Math.PI/180;
  const a=Math.sin((l2-l1)*p/2)**2 + Math.cos(l1*p)*Math.cos(l2*p)*Math.sin((o2-o1)*p/2)**2;
  const d=R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  let text='အကွာအဝေး: ';
  if(d<1000) text+=Math.round(d)+' မီတာ';
  else text+=(d/1000).toFixed(2)+' ကီလိုမီတာ';
  document.getElementById('distInfo').innerText=text;
  document.getElementById('distInfo').classList.remove('hide');
}
</script>
</body>
  </html>
